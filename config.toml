# Default rules for file-organizer.
# Paths under [rules] are relative to folders.root.
# The first segment may be a folder alias (documents, pictures, ...).

[folders]
root = "~/Organized"
documents = "Documents"
pictures = "Pictures"
music = "Music"
videos = "Videos"
archives = "Archives"
software = "Software"
code = "Code"
other = "Other"
duplicates = "Duplicates"
reports = "Reports"

[organize]
collision = "number"
on_duplicate = "skip"
recursive = false
watch = ["~/Downloads"]
stable_wait = "2s"

[rules]
pdf = "documents/PDF"
doc = "documents/Word"
docx = "documents/Word"
odt = "documents/Word"
rtf = "documents/Word"
xls = "documents/Excel"
xlsx = "documents/Excel"
ods = "documents/Excel"
csv = "documents/Excel"
ppt = "documents/Slides"
pptx = "documents/Slides"
odp = "documents/Slides"
txt = "documents/Text"
md = "documents/Text"
"report.pdf" = "reports"
"brismarp.report.pdf" = "reports/Brismarp"
"ordentus.report.pdf" = "reports/Ordentus"
"up.report.pdf" = "reports/Up"

jpg = "pictures"
jpeg = "pictures"
png = "pictures"
gif = "pictures"
webp = "pictures"
